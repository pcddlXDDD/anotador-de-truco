:root{--bg:#fafaf8;--fg:#1a1a1a;--mut:#8a8a85;--line:#e2e2dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}

.seg button.on{background:var(--fg);color:var(--bg)}

#teams{--s:40px;flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);border-top:1px solid var(--line)}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
.col:last-child{border-right:0}

.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name::after{content:"";flex:none;width:5px;height:5px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg) translateY(-2px)}
#bd{position:fixed;inset:0;z-index:19}
#menu{position:fixed;z-index:20;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);overflow:hidden}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;padding:13px 16px;text-align:left}
.opt.cur{font-weight:600}
.opt i{font-style:normal;color:var(--mut)}
.cus{display:flex;gap:8px;padding:10px 12px}
.cus input{flex:1;min-width:0;background:none;border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:16px;padding:8px 10px}
.ok{background:var(--fg);color:var(--bg);border:0;border-radius:8px;font:inherit;font-size:14px;padding:0 14px}
.board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:6px 0;cursor:pointer;overflow:hidden}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sec{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*.08)}
svg{width:var(--s);height:var(--s);display:block}
